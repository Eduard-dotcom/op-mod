<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>OpenSim 3.3 — Эмулятор загрузки + Проверка геометрии</title>
<style>
:root{--bg:#0d1117;--surface:#161b22;--border:#30363d;--text:#c9d1d9;--green:#3fb950;--red:#f85149;--yellow:#d29922;--blue:#58a6ff;--purple:#bc8cff;--cyan:#39d2c0}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px}
h1{text-align:center;font-size:1.5em;margin-bottom:3px;color:var(--blue)}
.subtitle{text-align:center;color:#8b949e;margin-bottom:15px;font-size:0.85em}
.tabs{display:flex;gap:0;margin-bottom:20px;border-radius:10px;overflow:hidden;border:1px solid var(--border)}
.tab{flex:1;padding:12px;text-align:center;cursor:pointer;background:var(--surface);color:#8b949e;font-weight:600;transition:all .2s;font-size:0.95em}
.tab:hover{color:var(--text)}
.tab.active{background:var(--blue);color:#fff}
.tab .badge{display:inline-block;background:var(--red);color:#fff;border-radius:10px;padding:1px 7px;font-size:0.75em;margin-left:5px;vertical-align:middle}
.tab-content{display:none}
.tab-content.active{display:block}
.upload-zone{background:var(--surface);border:2px dashed var(--border);border-radius:12px;padding:30px;text-align:center;cursor:pointer;transition:border-color .3s;margin-bottom:15px}
.upload-zone:hover,.upload-zone.dragover{border-color:var(--blue)}
.upload-zone svg{width:40px;height:40px;fill:var(--blue);margin-bottom:8px}
.upload-zone p{color:#8b949e;font-size:1em}
.upload-zone .hint{font-size:0.8em;color:#6e7681;margin-top:6px}
#fileInput,#geomInput{display:none}
.geom-upload{margin-bottom:15px}
.geom-upload label{display:block;color:#8b949e;font-size:0.9em;margin-bottom:8px}
.geom-row{display:flex;gap:10px;align-items:center}
.geom-row input[type=text]{flex:1;padding:10px;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:0.9em}
.geom-row button{padding:10px 16px;border-radius:8px;border:1px solid var(--blue);background:transparent;color:var(--blue);cursor:pointer;font-size:0.9em;white-space:nowrap}
.geom-row button:hover{background:var(--blue);color:#fff}
.progress-container{display:none;margin-bottom:15px}
.progress-bar{height:5px;background:var(--surface);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--purple));width:0;transition:width .3s;border-radius:3px}
.progress-text{font-size:0.8em;color:#8b949e;margin-top:4px;text-align:center}
.results{display:none}
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:15px}
.summary-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center}
.summary-card .num{font-size:1.8em;font-weight:700}
.summary-card .label{font-size:0.8em;color:#8b949e;margin-top:3px}
.card-errors .num{color:var(--red)}
.card-warn .num{color:var(--yellow)}
.card-ok .num{color:var(--green)}
.card-info .num{color:var(--blue)}
.card-cyan .num{color:var(--cyan)}
.phase-log{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:15px}
.phase-log h3{color:var(--blue);margin-bottom:8px;font-size:1em}
.phase-step{display:flex;align-items:flex-start;gap:8px;padding:4px 0;border-bottom:1px solid #21262d;font-size:0.85em}
.phase-step:last-child{border:none}
.phase-icon{flex-shrink:0;width:18px;text-align:center}
.phase-ok{color:var(--green)}.phase-err{color:var(--red)}.phase-warn{color:var(--yellow)}.phase-skip{color:#6e7681}
.error-list{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:15px}
.error-list h3{margin-bottom:8px;font-size:1em}
.error-list h3.err-header{color:var(--red)}
.error-list h3.warn-header{color:var(--yellow)}
.err-item{padding:7px 10px;margin-bottom:5px;border-radius:5px;font-size:0.82em;font-family:'Consolas','Monaco',monospace;line-height:1.4}
.err-critical{background:rgba(248,81,73,.12);border-left:3px solid var(--red)}
.err-high{background:rgba(210,153,34,.12);border-left:3px solid var(--yellow)}
.err-medium{background:rgba(88,166,255,.12);border-left:3px solid var(--blue)}
.err-geom{background:rgba(57,210,192,.12);border-left:3px solid var(--cyan)}
.err-code{color:var(--red);font-weight:600}
.warn-code{color:var(--yellow);font-weight:600}
.cyan-code{color:var(--cyan);font-weight:600}
.filter-bar{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.filter-btn{padding:5px 12px;border-radius:5px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;font-size:0.82em;transition:all .2s}
.filter-btn:hover{border-color:var(--blue)}
.filter-btn.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.stats-bar{display:flex;gap:14px;margin-bottom:14px;font-size:0.82em;flex-wrap:wrap}
.stats-bar span{color:#8b949e}.stats-bar strong{color:var(--text)}
.geom-results{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:15px}
.geom-results h3{color:var(--cyan);margin-bottom:8px;font-size:1em}
.geom-table{width:100%;border-collapse:collapse;font-size:0.82em}
.geom-table th{text-align:left;padding:6px 8px;background:#21262d;color:#8b949e;font-weight:600;border-bottom:1px solid var(--border)}
.geom-table td{padding:5px 8px;border-bottom:1px solid #21262d}
.geom-table tr:hover{background:rgba(88,166,255,.05)}
.geom-found{color:var(--green)}.geom-missing{color:var(--red);font-weight:600}
.geom-orphan{color:var(--yellow)}
.scale-warn{color:var(--yellow)}
</style>
</head>
<body>

<h1>🔧 OpenSim 3.3 — Эмулятор загрузки + Проверка геометрии</h1>
<p class="subtitle">Имитация загрузки OpenSim + верификация файлов .vtp/.obj геометрии + проверка scale_factors</p>

<div class="tabs">
  <div class="tab active" data-tab="model">🖥 Модель</div>
  <div class="tab" data-tab="geometry">📦 Геометрия<span class="badge" id="geomBadge" style="display:none">!</span></div>
</div>

<div class="tab-content active" id="tab-model">
  <div class="upload-zone" id="uploadZone">
    <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm-1 1.5L18.5 9H13V3.5zM6 20V4h5v7h7v9H6z"/></svg>
    <p>Перетащите .osim файл или нажмите для выбора</p>
    <p class="hint">OpenSim 3.3 (.osim XML)</p>
  </div>
  <input type="file" id="fileInput" accept=".osim,.xml">

  <div class="progress-container" id="progress"><div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div><div class="progress-text" id="progressText">Загрузка...</div></div>
  <div class="results" id="results">
    <div class="summary-grid" id="summaryGrid"></div>
    <div class="phase-log" id="phaseLog"></div>
    <div class="stats-bar" id="statsBar"></div>
    <div class="filter-bar" id="filterBar"></div>
    <div class="error-list" id="errorList"></div>
  </div>
</div>

<div class="tab-content" id="tab-geometry">
  <div class="geom-upload">
    <label>1. Загрузите .osim файл (тот же, что и в первой вкладке)</label>
    <div class="upload-zone" id="geomOsimZone" style="padding:20px">
      <p>Загрузите .osim файл</p>
    </div>
    <input type="file" id="geomOsimInput" accept=".osim,.xml">
  </div>
  <div class="geom-upload">
    <label>2. Выберите папку Geometry (с .vtp/.obj файлами) — или загрузите несколько файлов геометрии</label>
    <div class="geom-row">
      <input type="text" id="geomFolderPath" placeholder="Имя папки (например: Geometry)" value="Geometry">
      <button id="loadGeomBtn">📂 Выбрать файлы геометрии</button>
    </div>
    <input type="file" id="geomFilesInput" multiple accept=".vtp,.obj,.stl,.ply">
  </div>
  <div id="geomResults"></div>
</div>

<script>
// ============================================================
//  OPENSIM 3.3 MODEL LOADING EMULATOR + GEOMETRY CHECKER
// ============================================================

const SEVERITY={CRITICAL:'CRITICAL',HIGH:'HIGH',MEDIUM:'MEDIUM',LOW:'LOW',GEOM:'GEOM'};
const PHASE={XML:'XML Parsing',MODEL:'Model Header',BODYSET:'BodySet',JOINTSET:'JointSet',COORDSET:'CoordinateSet',FORCESET:'ForceSet',MUSCLES:'Muscles',PATHPOINTS:'PathPoints',CPP:'ConditionalPathPoints',MPP:'MovingPathPoints',INERTIA:'Inertia',MASS:'Mass',GEOMETRY:'Geometry',SCALE:'Scale Factors',INIT:'initSystem()'};

let allErrors=[],modelData=null,geomFiles=new Set(),currentFilter='all',osimXmlDoc=null;

// ---- TABS ----
document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('tab-'+tab.dataset.tab).classList.add('active');
  });
});

// ---- FILE UPLOAD (TAB 1) ----
const uploadZone=document.getElementById('uploadZone');
const fileInput=document.getElementById('fileInput');
uploadZone.addEventListener('click',()=>fileInput.click());
uploadZone.addEventListener('dragover',e=>{e.preventDefault();uploadZone.classList.add('dragover')});
uploadZone.addEventListener('dragleave',()=>uploadZone.classList.remove('dragover'));
uploadZone.addEventListener('drop',e=>{e.preventDefault();uploadZone.classList.remove('dragover');if(e.dataTransfer.files.length)handleFile(e.dataTransfer.files[0])});
fileInput.addEventListener('change',e=>{if(e.target.files.length)handleFile(e.target.files[0])});

function handleFile(file){
  document.getElementById('progress').style.display='block';
  document.getElementById('results').style.display='none';
  const reader=new FileReader();
  reader.onload=e=>{runValidation(e.target.result,file.name)};
  reader.readAsText(file);
}

// ---- GEOMETRY TAB UPLOADS ----
const geomOsimZone=document.getElementById('geomOsimZone');
const geomOsimInput=document.getElementById('geomOsimInput');
geomOsimZone.addEventListener('click',()=>geomOsimInput.click());
geomOsimInput.addEventListener('change',e=>{
  if(e.target.files.length){
    const r=new FileReader();
    r.onload=ev=>{
      const parser=new DOMParser();
      osimXmlDoc=parser.parseFromString(ev.target.result,'text/xml');
      geomOsimZone.innerHTML='<p style="color:var(--green)">✅ .osim загружен</p>';
      checkGeometry();
    };
    r.readAsText(e.target.files[0]);
  }
});

document.getElementById('loadGeomBtn').addEventListener('click',()=>document.getElementById('geomFilesInput').click());
document.getElementById('geomFilesInput').addEventListener('change',e=>{
  const folder=document.getElementById('geomFolderPath').value.trim()||'Geometry';
  for(const f of e.target.files){
    // Extract relative path - use webkitRelativePath if available
    let relPath=f.name;
    if(f.webkitRelativePath) relPath=f.webkitRelativePath;
    // Store just the filename for matching
    geomFiles.add(f.name);
  }
  document.getElementById('loadGeomBtn').textContent=`✅ ${geomFiles.size} файлов загружено`;
  checkGeometry();
});

function checkGeometry(){
  if(!osimXmlDoc||geomFiles.size===0) return;
  allErrors=allErrors.filter(e=>e.phase!==PHASE.GEOMETRY&&e.phase!==PHASE.SCALE);
  
  const modelEl=osimXmlDoc.querySelector('Model');
  if(!modelEl) return;
  
  // 1. Collect all geometry references from the model
  const meshRefs=new Map(); // mesh_file -> [{body, display_geom}]
  const bodies=modelEl.querySelectorAll('Body');
  
  bodies.forEach(body=>{
    const bodyName=body.getAttribute('name');
    const visObj=body.querySelector('VisibleObject');
    if(!visObj) return;
    const geomSet=visObj.querySelector('GeometrySet');
    if(!geomSet) return;
    const displayGeoms=geomSet.querySelectorAll('DisplayGeometry');
    displayGeoms.forEach(dg=>{
      const meshFile=dg.querySelector('geometry_file');
      if(meshFile){
        const mf=meshFile.textContent.trim();
        const scaleEl=dg.querySelector('scale_factors');
        const colorEl=dg.querySelector('color');
        const transformEl=dg.querySelector('transform');
        
        let scale=[1,1,1];
        if(scaleEl) scale=scaleEl.textContent.trim().split(/\s+/).map(Number);
        
        let transform=[0,0,0,0,0,0];
        if(transformEl) transform=transformEl.textContent.trim().split(/\s+/).map(Number);
        
        if(!meshRefs.has(mf)) meshRefs.set(mf,[]);
        meshRefs.get(mf).push({body:bodyName, scale, transform, color:colorEl?colorEl.textContent.trim():''});
        
        // Check scale factors
        if(scale.some(s=>s===0)){
          addError(PHASE.SCALE,SEVERITY.HIGH,'ZERO_SCALE_FACTOR',
            `Тело "${bodyName}": geometry_file="${mf}" — scale_factor содержит 0 → объект не будет виден`);
        }
        if(scale.some(s=>s<0)){
          addError(PHASE.SCALE,SEVERITY.MEDIUM,'NEGATIVE_SCALE_FACTOR',
            `Тело "${bodyName}": geometry_file="${mf}" — scale_factor содержит отрицательное значение → отражение`);
        }
        if(scale.some(s=>s>10)){
          addError(PHASE.SCALE,SEVERITY.MEDIUM,'VERY_LARGE_SCALE',
            `Тело "${bodyName}": geometry_file="${mf}" — scale_factor [${scale.join(', ')}] — подозрительно большой`);
        }
        // Check very small scale (likely error)
        if(scale.some(s=>s>0&&s<0.01)){
          addError(PHASE.SCALE,SEVERITY.HIGH,'VERY_SMALL_SCALE',
            `Тело "${bodyName}": geometry_file="${mf}" — scale_factor [${scale.join(', ')}] — подозрительно малый, объект может быть невидим`);
        }
      }
    });
  });
  
  // Also check WrapObject geometry
  const wrapObjects=modelEl.querySelectorAll('WrapSphere, WrapCylinder, WrapEllipsoid, WrapTorus');
  wrapObjects.forEach(wo=>{
    const bodyName=wo.closest('Body')?.getAttribute('name')||'???';
    const meshFile=wo.querySelector('geometry_file');
    if(meshFile){
      const mf=meshFile.textContent.trim();
      if(!meshRefs.has(mf)) meshRefs.set(mf,[]);
      meshRefs.get(mf).push({body:bodyName+' (wrap)', scale:[1,1,1], transform:[0,0,0,0,0,0], color:''});
    }
  });
  
  // 2. Check which mesh files exist / are missing
  const missing=[];
  const found=[];
  for(const [mf,refs] of meshRefs){
    // Try to match: exact name, or with Geometry/ prefix
    let isFound=false;
    for(const gf of geomFiles){
      if(gf===mf||gf.endsWith('/'+mf)||gf.endsWith('\\'+mf)){
        isFound=true;break;
      }
    }
    if(isFound) found.push(mf);
    else missing.push({file:mf, usedIn:refs});
  }
  
  // 3. Check for orphan files (in Geometry folder but not referenced)
  const allRefFiles=new Set(meshRefs.keys());
  const orphans=[];
  for(const gf of geomFiles){
    const baseName=gf.split(/[/\\]/).pop();
    let isUsed=false;
    for(const ref of allRefFiles){
      if(ref===baseName||ref===gf||ref.endsWith(baseName)){isUsed=true;break;}
    }
    if(!isUsed&&(/\.(vtp|obj|stl|ply)$/i.test(baseName))){
      orphans.push(baseName);
    }
  }
  
  // Report missing files
  for(const m of missing){
    const bodyList=[...new Set(m.usedIn.map(r=>r.body))].join(', ');
    addError(PHASE.GEOMETRY,SEVERITY.HIGH,'MISSING_GEOMETRY_FILE',
      `Файл "${m.file}" не найден → тела: ${bodyList}. OpenSim: "Unable to locate geometry file" → объект невидим`);
  }
  
  // Report orphan files
  if(orphans.length>0){
    addError(PHASE.GEOMETRY,SEVERITY.LOW,'ORPHAN_GEOMETRY_FILES',
      `${orphans.length} файлов в папке Geometry не используются моделью (могут быть нужны для будущих компонентов)`);
  }
  
  // Render geometry results
  renderGeometryResults(meshRefs,missing,found,orphans);
}

function renderGeometryResults(meshRefs,missing,found,orphans){
  let html='<div class="geom-results">';
  html+=`<h3>📦 Результаты проверки геометрии</h3>`;
  html+=`<div class="summary-grid">`;
  html+=`<div class="summary-card card-ok"><div class="num">${found.length}</div><div class="label">Найдено</div></div>`;
  html+=`<div class="summary-card card-errors"><div class="num">${missing.length}</div><div class="label">Отсутствует</div></div>`;
  html+=`<div class="summary-card card-cyan"><div class="num">${meshRefs.size}</div><div class="label">Всего ссылок</div></div>`;
  html+=`<div class="summary-card card-warn"><div class="num">${orphans.length}</div><div class="label">Не используется</div></div>`;
  html+=`<div class="summary-card card-info"><div class="num">${geomFiles.size}</div><div class="label">Файлов в папке</div></div>`;
  html+=`</div>`;
  
  if(missing.length>0){
    html+=`<h3 style="color:var(--red);margin-top:10px">❌ Отсутствующие файлы геометрии</h3>`;
    html+=`<table class="geom-table"><tr><th>Файл</th><th>Тела</th><th>Scale</th></tr>`;
    for(const m of missing){
      const bodyList=[...new Set(m.usedIn.map(r=>r.body))].join(', ');
      const scale=m.usedIn[0].scale.join(' × ');
      html+=`<tr><td class="geom-missing">${m.file}</td><td>${bodyList}</td><td>${scale}</td></tr>`;
    }
    html+=`</table>`;
  }
  
  if(orphans.length>0){
    html+=`<h3 style="color:var(--yellow);margin-top:10px">⚠ Неиспользуемые файлы (orphans)</h3>`;
    html+=`<div style="font-size:0.82em;color:#8b949e;max-height:200px;overflow-y:auto">`;
    for(const o of orphans.sort()){
      html+=`<div class="geom-orphan" style="padding:2px 8px">📎 ${o}</div>`;
    }
    html+=`</div>`;
  }
  
  // All referenced files table
  html+=`<h3 style="color:var(--cyan);margin-top:15px">📋 Все ссылки на геометрию</h3>`;
  html+=`<div style="max-height:400px;overflow-y:auto">`;
  html+=`<table class="geom-table"><tr><th>Файл</th><th>Тело</th><th>Scale</th><th>Transform</th><th>Статус</th></tr>`;
  for(const [mf,refs] of meshRefs){
    const isFound=!missing.some(m=>m.file===mf);
    for(const r of refs){
      const status=isFound?'<span class="geom-found">✓ найден</span>':'<span class="geom-missing">✗ отсутствует</span>';
      const scaleStr=r.scale.map(s=>{
        if(s===0) return `<span class="scale-warn">${s}</span>`;
        if(s<0.01&&s>0) return `<span class="scale-warn">${s}</span>`;
        return s;
      }).join(' × ');
      html+=`<tr><td>${mf}</td><td>${r.body}</td><td>${scaleStr}</td><td>${r.transform.join(', ')}</td><td>${status}</td></tr>`;
    }
  }
  html+=`</table></div>`;
  html+=`</div>`;
  
  document.getElementById('geomResults').innerHTML=html;
  
  // Update badge
  if(missing.length>0){
    const badge=document.getElementById('geomBadge');
    badge.style.display='inline';
    badge.textContent=missing.length;
  }
}

// ---- MAIN VALIDATION (same as file 1) ----
async function runValidation(xmlText,fileName){
  allErrors=[];modelData={bodies:{},joints:{},coordinates:{},muscles:[],forces:[],meshes:[]};
  const phases=[];
  updateProgress(5,'Парсинг XML...');
  let parser,xmlDoc;
  try{
    parser=new DOMParser();xmlDoc=parser.parseFromString(xmlText,'text/xml');
    const parseErr=xmlDoc.querySelector('parsererror');
    if(parseErr){addError(PHASE.XML,SEVERITY.CRITICAL,'XML_PARSE_ERROR',parseErr.textContent.substring(0,200));phases.push({name:PHASE.XML,status:'error',count:1});showResults(phases);return;}
    osimXmlDoc=xmlDoc;
    phases.push({name:PHASE.XML,status:'ok',count:0});
  }catch(e){addError(PHASE.XML,SEVERITY.CRITICAL,'XML_PARSE_ERROR',e.message);phases.push({name:PHASE.XML,status:'error',count:1});showResults(phases);return;}

  const modelEl=xmlDoc.querySelector('Model');
  if(!modelEl){addError(PHASE.MODEL,SEVERITY.CRITICAL,'NO_MODEL_ELEMENT','<Model> не найден');phases.push({name:PHASE.MODEL,status:'error',count:1});showResults(phases);return;}
  phases.push({name:PHASE.MODEL,status:'ok',count:0});

  updateProgress(20,'BodySet...');
  const bodySetEl=modelEl.querySelector('BodySet');
  if(bodySetEl){
    const bodies=bodySetEl.querySelectorAll('Body');const bodyNames=new Set();
    bodies.forEach(b=>{
      const name=b.getAttribute('name');if(!name){addError(PHASE.BODYSET,SEVERITY.CRITICAL,'BODY_NO_NAME','Тело без name');return;}
      if(bodyNames.has(name))addError(PHASE.BODYSET,SEVERITY.CRITICAL,'DUPLICATE_BODY_NAME',`Дублирующее тело: "${name}"`);
      bodyNames.add(name);
      const mass=parseFloat(b.querySelector('mass')?.textContent||'0');modelData.bodies[name]={mass,el:b};
      if(mass<0)addError(PHASE.MASS,SEVERITY.CRITICAL,'NEGATIVE_MASS',`"${name}": отрицательная масса ${mass}`);
      if(mass>0&&mass<0.001&&name!=='ground')addError(PHASE.MASS,SEVERITY.HIGH,'SUSPICIOUS_LOW_MASS',`"${name}": масса ${mass.toFixed(6)} кг — подозрительно мало`);
      if(mass>20)addError(PHASE.MASS,SEVERITY.MEDIUM,'SUSPICIOUS_HIGH_MASS',`"${name}": масса ${mass.toFixed(2)} кг`);
    });
  }
  phases.push({name:PHASE.BODYSET,status:ce(PHASE.BODYSET)>0?'warn':'ok',count:ce(PHASE.BODYSET)});

  updateProgress(30,'JointSet...');
  const jointSetEl=modelEl.querySelector('JointSet');
  if(jointSetEl){
    const joints=jointSetEl.querySelectorAll(':scope > objects > *');const jn=new Set();
    joints.forEach(j=>{
      const name=j.getAttribute('name');if(!name)return;if(jn.has(name))addError(PHASE.JOINTSET,SEVERITY.CRITICAL,'DUPLICATE_JOINT_NAME',`Дублирующий сустав: "${name}"`);
      jn.add(name);modelData.joints[name]={el:j};
      const pb=j.querySelector('parent_body'),cb=j.querySelector('child_body');
      if(pb&&!(pb.textContent.trim()in modelData.bodies))addError(PHASE.JOINTSET,SEVERITY.CRITICAL,'JOINT_INVALID_PARENT',`"${name}": parent "${pb.textContent.trim()}" не найден`);
      if(cb&&!(cb.textContent.trim()in modelData.bodies))addError(PHASE.JOINTSET,SEVERITY.CRITICAL,'JOINT_INVALID_CHILD',`"${name}": child "${cb.textContent.trim()}" не найден`);
    });
  }
  phases.push({name:PHASE.JOINTSET,status:ce(PHASE.JOINTSET)>0?'warn':'ok',count:ce(PHASE.JOINTSET)});

  updateProgress(40,'CoordinateSet...');
  const coords=xmlDoc.querySelectorAll('Coordinate');const coordNames=new Set();
  coords.forEach(c=>{
    const name=c.getAttribute('name');if(!name)return;
    if(coordNames.has(name))addError(PHASE.COORDSET,SEVERITY.CRITICAL,'DUPLICATE_COORD_NAME',`Дублирующая координата: "${name}"`);
    coordNames.add(name);
    const r=c.querySelector('range');if(r){const p=r.textContent.trim().split(/\s+/);if(p.length===2){const lo=parseFloat(p[0]),hi=parseFloat(p[1]);if(lo>=hi)addError(PHASE.COORDSET,SEVERITY.HIGH,'INVALID_RANGE',`"${name}": range [${lo},${hi}]`);modelData.coordinates[name]={min:lo,max:hi};}}
  });
  phases.push({name:PHASE.COORDSET,status:ce(PHASE.COORDSET)>0?'warn':'ok',count:ce(PHASE.COORDSET)});

  updateProgress(50,'ForceSet...');
  const forceSetEl=modelEl.querySelector('ForceSet');let muscleCount=0;
  if(forceSetEl){
    const forces=forceSetEl.querySelectorAll(':scope > objects > *');const fn=new Set();
    forces.forEach(f=>{const name=f.getAttribute('name');const tag=f.tagName;if(!name)return;if(fn.has(name))addError(PHASE.FORCESET,SEVERITY.CRITICAL,'DUPLICATE_FORCE_NAME',`Дублирующая сила: "${name}"`);fn.add(name);if(tag.includes('Muscle'))muscleCount++;modelData.forces.push({name,tag,el:f});});
  }
  phases.push({name:PHASE.FORCESET,status:ce(PHASE.FORCESET)>0?'warn':'ok',count:ce(PHASE.FORCESET)});

  updateProgress(60,'Muscles...');
  if(forceSetEl){
    forceSetEl.querySelectorAll(':scope > objects > *').forEach(m=>{
      const name=m.getAttribute('name');if(!m.tagName.includes('Muscle'))return;
      const fiso=parseFloat(m.querySelector('max_isometric_force')?.textContent||'0');
      const lfib=parseFloat(m.querySelector('optimal_fiber_length')?.textContent||'0');
      const ltend=parseFloat(m.querySelector('tendon_slack_length')?.textContent||'0');
      const penn=parseFloat(m.querySelector('pennation_angle_at_optimal')?.textContent||'0');
      modelData.muscles.push({name,tag:m.tagName,fiso,lfib,ltend,penn});
      if(lfib>0&&ltend>0&&Math.abs(lfib-ltend)<0.000001)addError(PHASE.MUSCLES,SEVERITY.HIGH,'FIBER_EQUALS_TENDON',`"${name}": Lfib==Ltend==${lfib.toFixed(6)}`);
      if(fiso===0)addError(PHASE.MUSCLES,SEVERITY.HIGH,'ZERO_FISO',`"${name}": Fiso=0`);
      if(fiso>0&&fiso<2)addError(PHASE.MUSCLES,SEVERITY.MEDIUM,'VERY_LOW_FISO',`"${name}": Fiso=${fiso.toFixed(1)} N`);
      if(lfib<0)addError(PHASE.MUSCLES,SEVERITY.CRITICAL,'NEGATIVE_FIBER',`"${name}": отрицательный Lfib`);
      if(ltend<0)addError(PHASE.MUSCLES,SEVERITY.CRITICAL,'NEGATIVE_TENDON',`"${name}": отрицательный Ltend`);
      if(lfib===0&&fiso>0)addError(PHASE.MUSCLES,SEVERITY.HIGH,'ZERO_FIBER',`"${name}": Lfib=0 при Fiso>0`);
      if(ltend>0&&lfib/ltend>100)addError(PHASE.MUSCLES,SEVERITY.MEDIUM,'HIGH_RATIO',`"${name}": Lfib/Ltend=${(lfib/ltend).toFixed(1)}`);
      if(penn>1.0472)addError(PHASE.MUSCLES,SEVERITY.MEDIUM,'LARGE_PENNATION',`"${name}": pennation ${(penn*180/Math.PI).toFixed(1)}°`);
    });
  }
  phases.push({name:PHASE.MUSCLES,status:ce(PHASE.MUSCLES)>0?'warn':'ok',count:ce(PHASE.MUSCLES)});

  updateProgress(70,'PathPoints...');
  if(forceSetEl){
    forceSetEl.querySelectorAll(':scope > objects > *').forEach(m=>{
      const name=m.getAttribute('name');if(!m.tagName.includes('Muscle')&&!m.tagName.includes('PathActuator'))return;
      const gp=m.querySelector('GeometryPath');if(!gp)return;const pps=gp.querySelector('PathPointSet');if(!pps)return;
      const ppList=pps.querySelectorAll('PathPoint, MovingPathPoint, ConditionalPathPoint');
      if(ppList.length<2)addError(PHASE.PATHPOINTS,SEVERITY.HIGH,'TOO_FEW_PP',`"${name}": ${ppList.length} точек`);
      const bUsed=new Set();ppList.forEach(pp=>{const b=pp.querySelector('body');if(b)bUsed.add(b.textContent.trim());});
      if(bUsed.size===1&&ppList.length>=2){const sb=[...bUsed][0];if(sb!=='ground')addError(PHASE.PATHPOINTS,SEVERITY.HIGH,'ALL_SAME_BODY',`"${name}": все точки на "${sb}" — нулевой момент`);}
      ppList.forEach(pp=>{const b=pp.querySelector('body');if(b&&!(b.textContent.trim()in modelData.bodies))addError(PHASE.PATHPOINTS,SEVERITY.CRITICAL,'INVALID_PP_BODY',`"${name}": тело "${b.textContent.trim()}" не найдено`);});
      const pn=new Set(),pd=new Set();ppList.forEach(pp=>{const n=pp.getAttribute('name');if(n){if(pn.has(n))pd.add(n);pn.add(n);}});
      pd.forEach(d=>addError(PHASE.PATHPOINTS,SEVERITY.HIGH,'DUP_PP_NAME',`"${name}": дублирующий PathPoint "${d}"`));
    });
  }
  phases.push({name:PHASE.PATHPOINTS,status:ce(PHASE.PATHPOINTS)>0?'warn':'ok',count:ce(PHASE.PATHPOINTS)});

  updateProgress(78,'ConditionalPathPoints...');
  if(forceSetEl){
    forceSetEl.querySelectorAll('ConditionalPathPoint').forEach(cpp=>{
      const ce2=cpp.querySelector('coordinate');if(!ce2)return;
      const cn=ce2.textContent.trim();
      if(!(cn in modelData.coordinates)){const mn=cpp.closest('[name]')?.getAttribute('name')||'???';addError(PHASE.CPP,SEVERITY.CRITICAL,'CPP_INVALID_COORD',`"${mn}": координата "${cn}" не найдена`);}
      const re=cpp.querySelector('range');if(re&&cn in modelData.coordinates){
        const p=re.textContent.trim().split(/\s+/);if(p.length===2){const lo=parseFloat(p[0]),hi=parseFloat(p[1]);const c=modelData.coordinates[cn];
        if(lo<c.min){const mn=cpp.closest('[name]')?.getAttribute('name')||'???';addError(PHASE.CPP,SEVERITY.HIGH,'CPP_RANGE_EXCEEDS',`"${mn}": CPP range [${lo},${hi}] выходит за coord [${c.min},${c.max}]`);}
        if(hi>c.max){const mn=cpp.closest('[name]')?.getAttribute('name')||'???';addError(PHASE.CPP,SEVERITY.HIGH,'CPP_RANGE_EXCEEDS',`"${mn}": CPP range [${lo},${hi}] > coord max ${c.max}`);}
      }}
    });
  }
  phases.push({name:PHASE.CPP,status:ce(PHASE.CPP)>0?'warn':'ok',count:ce(PHASE.CPP)});

  updateProgress(84,'MovingPathPoints...');
  if(forceSetEl){
    forceSetEl.querySelectorAll('MovingPathPoint').forEach(mpp=>{
      ['x_coordinate','y_coordinate','z_coordinate'].forEach(ct=>{
        const ce2=mpp.querySelector(ct);if(!ce2)return;const cn=ce2.textContent.trim();
        if(!(cn in modelData.coordinates)){const mn=mpp.closest('[name]')?.getAttribute('name')||'???';addError(PHASE.MPP,SEVERITY.CRITICAL,'MPP_INVALID_COORD',`"${mn}": ${ct}="${cn}" не найдена`);}
        const mn=mpp.closest('[name]')?.getAttribute('name')||'';
        if(mn.endsWith('_r')&&cn.includes('_l'))addError(PHASE.MPP,SEVERITY.HIGH,'MPP_WRONG_SIDE',`"${mn}" (_r): ${ct}="${cn}" — левая координата`);
        if(mn.endsWith('_l')&&cn.includes('_r'))addError(PHASE.MPP,SEVERITY.HIGH,'MPP_WRONG_SIDE',`"${mn}" (_l): ${ct}="${cn}" — правая координата`);
      });
    });
  }
  phases.push({name:PHASE.MPP,status:ce(PHASE.MPP)>0?'warn':'ok',count:ce(PHASE.MPP)});

  updateProgress(90,'Inertia...');
  for(const[bn,bd]of Object.entries(modelData.bodies)){
    if(bn==='ground')continue;const b=bd.el;const m=bd.mass;
    const ixx=parseFloat(b.querySelector('inertia_xx')?.textContent||'0'),iyy=parseFloat(b.querySelector('inertia_yy')?.textContent||'0'),izz=parseFloat(b.querySelector('inertia_zz')?.textContent||'0');
    if(m>0&&ixx===0&&iyy===0&&izz===0)addError(PHASE.INERTIA,SEVERITY.HIGH,'ZERO_INERTIA',`"${bn}": масса>0, инерция=0`);
    if(m>0&&(ixx<0||iyy<0||izz<0))addError(PHASE.INERTIA,SEVERITY.CRITICAL,'NEGATIVE_INERTIA',`"${bn}": отрицательная инерция`);
  }
  phases.push({name:PHASE.INERTIA,status:ce(PHASE.INERTIA)>0?'warn':'ok',count:ce(PHASE.INERTIA)});

  updateProgress(95,'Mass...');
  let tm=0;for(const bd of Object.values(modelData.bodies))tm+=bd.mass;
  if(tm<30)addError(PHASE.MASS,SEVERITY.HIGH,'LOW_TOTAL_MASS',`Суммарная масса: ${tm.toFixed(2)} кг`);
  if(tm>200)addError(PHASE.MASS,SEVERITY.HIGH,'HIGH_TOTAL_MASS',`Суммарная масса: ${tm.toFixed(2)} кг`);
  phases.push({name:PHASE.MASS,status:ce(PHASE.MASS)>0?'warn':'ok',count:ce(PHASE.MASS)});
  phases.push({name:PHASE.INIT,status:'ok',count:0});

  updateProgress(100,'Готово!');
  showResults(phases);
}

function addError(phase,severity,code,message){allErrors.push({phase,severity,code,message,id:allErrors.length})}
function ce(phase){return allErrors.filter(e=>e.phase===phase).length}
function updateProgress(pct,text){document.getElementById('progressFill').style.width=pct+'%';document.getElementById('progressText').textContent=text}

function showResults(phases){
  document.getElementById('progress').style.display='none';document.getElementById('results').style.display='block';
  const cc=allErrors.filter(e=>e.severity===SEVERITY.CRITICAL).length,hc=allErrors.filter(e=>e.severity===SEVERITY.HIGH).length,mc=allErrors.filter(e=>e.severity===SEVERITY.MEDIUM).length;
  const loadable=cc===0,bc=Object.keys(modelData.bodies).length,jc=Object.keys(modelData.joints).length,muc=modelData.muscles.length;
  document.getElementById('summaryGrid').innerHTML=`
    <div class="summary-card ${loadable?'card-ok':'card-errors'}"><div class="num">${loadable?'✅':'❌'}</div><div class="label">${loadable?'Загрузится':'НЕ загрузится'}</div></div>
    <div class="summary-card card-errors"><div class="num">${cc}</div><div class="label">CRITICAL</div></div>
    <div class="summary-card card-warn"><div class="num">${hc}</div><div class="label">HIGH</div></div>
    <div class="summary-card card-info"><div class="num">${mc}</div><div class="label">MEDIUM</div></div>
    <div class="summary-card card-info"><div class="num">${bc}</div><div class="label">Тел</div></div>
    <div class="summary-card card-info"><div class="num">${muc}</div><div class="label">Мышц</div></div>
    <div class="summary-card card-info"><div class="num">${allErrors.length}</div><div class="label">Проблем</div></div>`;
  let ph='';phases.forEach(p=>{const i=p.status==='ok'?'✓':p.status==='warn'?'⚠':'✗';const c=p.status==='ok'?'phase-ok':p.status==='warn'?'phase-warn':'phase-err';ph+=`<div class="phase-step"><span class="phase-icon ${c}">${i}</span><span>${p.name}${p.count>0?' ('+p.count+')':''}</span></div>`;});
  document.getElementById('phaseLog').innerHTML='<h3>📋 Последовательность загрузки</h3>'+ph;
  let tm=0;for(const b of Object.values(modelData.bodies))tm+=b.mass;
  document.getElementById('statsBar').innerHTML=`<span>Масса: <strong>${tm.toFixed(2)} кг</strong></span><span>Координат: <strong>${Object.keys(modelData.coordinates).length}</strong></span>`;
  document.getElementById('filterBar').innerHTML=`<button class="filter-btn active" data-f="all">Все (${allErrors.length})</button><button class="filter-btn" data-f="CRITICAL">CRITICAL (${cc})</button><button class="filter-btn" data-f="HIGH">HIGH (${hc})</button><button class="filter-btn" data-f="MEDIUM">MEDIUM (${mc})</button>`;
  document.querySelectorAll('.filter-btn').forEach(btn=>{btn.addEventListener('click',()=>{document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');currentFilter=btn.dataset.f;renderErrors();});});
  renderErrors();
}

function renderErrors(){
  const f=currentFilter==='all'?allErrors:allErrors.filter(e=>e.severity===currentFilter);
  const cr=f.filter(e=>e.severity===SEVERITY.CRITICAL),hi=f.filter(e=>e.severity===SEVERITY.HIGH),me=f.filter(e=>e.severity===SEVERITY.MEDIUM);
  let h='';
  if(cr.length){h+='<h3 class="err-header">🔴 CRITICAL</h3>';cr.forEach(e=>h+=`<div class="err-item err-critical"><span class="err-code">[${e.code}]</span> ${e.phase}: ${e.message}</div>`);}
  if(hi.length){h+='<h3 class="warn-header">🟡 HIGH</h3>';hi.forEach(e=>h+=`<div class="err-item err-high"><span class="warn-code">[${e.code}]</span> ${e.phase}: ${e.message}</div>`);}
  if(me.length){h+='<h3 class="warn-header">🔵 MEDIUM</h3>';me.forEach(e=>h+=`<div class="err-item err-medium"><span class="cyan-code">[${e.code}]</span> ${e.phase}: ${e.message}</div>`);}
  if(!f.length)h='<p style="color:var(--green);text-align:center;padding:20px">✅ Проблем не обнаружено!</p>';
  document.getElementById('errorList').innerHTML=h;
}
</script>
</body>
</html>
